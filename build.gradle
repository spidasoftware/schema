////////////////////////////////////////////////////////////////////////////////////////////////////////////
// General Gradle Settings
////////////////////////////////////////////////////////////////////////////////////////////////////////////

apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'groovy'
apply plugin: 'project-report'
apply plugin: 'application'

group = 'com.spidasoftware'
version = '14.0.0-SNAPSHOT' // If you're changing the major version also change the currentVersion in ConverterUtils.

def schemaReleaseVersion = System.getenv("SCHEMA_RELEASE_VERSION")
if(schemaReleaseVersion){
	println "Using ENV version $schemaReleaseVersion"
	version = schemaReleaseVersion
}
description = "Schema"

java {
	toolchain { languageVersion = JavaLanguageVersion.of(11) }
	withSourcesJar()
}

// Schemas are kept in the top-level 'resources' dir rather than src/main/resources.
sourceSets.main.resources.srcDir('resources')

////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Dependencies
////////////////////////////////////////////////////////////////////////////////////////////////////////////
application {
    mainClass = 'com.spidasoftware.schema.validation.CommandLineValidator'
}

repositories {
	mavenCentral()
	maven { url = System.getenv("ARTIFACTORY_URL_EXPOSED") }
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		maven {
			url = System.getenv("ARTIFACTORY_URL_EXPOSED")
			credentials {
				username = System.getenv('ARTIFACTORY_USERNAME')
				password = System.getenv('ARTIFACTORY_PASSWORD')
			}
		}
	}
}

dependencies {
	implementation 'commons-codec:commons-codec:1.15'
	implementation group: 'org.apache.ant', name: 'ant', version: '1.10.18'
	implementation group: 'org.codehaus.groovy', name: 'groovy-all', version:'2.5.14'
	implementation (group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.22') {
		exclude(module: 'slf4j-api')
	}
	implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.36'
	implementation group: 'commons-io', name: 'commons-io', version:'2.21.0'
	api 'com.github.java-json-tools:json-schema-core:1.2.14'  // fge updated to java-json-tools - results schema does not parse
	api 'org.mozilla:rhino:1.7.15.1'  // replace the vulnerable version pulled in by json-schema-core
	implementation 'com.networknt:json-schema-validator:1.0.30-SNAPSHOT'
	api group: 'org.mongodb', name:'mongo-java-driver', version:'2.11.1'
	implementation group: 'com.spidasoftware', name: 'schema-v4', version:'0.1'
	testImplementation group: 'junit', name: 'junit', version:'4.13.2'
	testImplementation group: 'org.spockframework', name: 'spock-core', version: '2.3-groovy-2.5'
	testRuntimeOnly('net.bytebuddy:byte-buddy:1.14.2')  // so spock can create mocks
	testImplementation group: 'org.objenesis', name:'objenesis', version: '2.6'
	testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.9.2")
}

test {
	useJUnitPlatform()
    testLogging.showStandardStreams = true
}

////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Build Process
////////////////////////////////////////////////////////////////////////////////////////////////////////////

// ValueSource lets the configuration cache run git as a tracked build input instead of
// an untracked external process at configuration time.
import javax.inject.Inject
import org.gradle.process.ExecOperations

abstract class GitValue implements ValueSource<String, GitValue.Params> {
	interface Params extends ValueSourceParameters {
		ListProperty<String> getArgs()
	}

	@Inject
	abstract ExecOperations getExec()

	@Override
	String obtain() {
		def out = new ByteArrayOutputStream()
		exec.exec { spec ->
			spec.commandLine(['git'] + parameters.args.get())
			spec.standardOutput = out
		}
		return out.toString().trim()
	}
}

def gitRevision = providers.of(GitValue) { parameters.args = ['rev-parse', '--short', 'HEAD'] }
def gitTimestamp = providers.of(GitValue) { parameters.args = ['show', '-s', '--format=%ct', 'HEAD'] }

tasks.named('jar') {
	manifest.attributes(
		'VCSVersion': gitRevision,
		'VCSTimeStamp': gitTimestamp,
		'Version': version
	)
}


////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Command Line Tools
////////////////////////////////////////////////////////////////////////////////////////////////////////////

/**
 * Searches the project properties first (where the properties should be kept),
 * then the system properties (where older integrations might expect them).
 * Both are read through Providers so the configuration cache tracks them as inputs.
 */
Provider<String> findPropertyAnywhere(String propertyName) {
	return providers.gradleProperty(propertyName)
		.orElse(providers.systemProperty(propertyName))
		.filter { !it.isEmpty() }
}

Provider<String> schema = findPropertyAnywhere('schema')
Provider<RegularFile> jsonFile = layout.projectDirectory.file(findPropertyAnywhere('jsonFile'))

tasks.register('validateJson', JavaExec) {
	dependsOn classes

	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.spidasoftware.schema.validation.CommandLineValidator'

	// projectDirectory.file resolves relative paths against the project dir, not the daemon's cwd
	if (schema.present && jsonFile.present) {
		args schema.get(), jsonFile.get().asFile.absolutePath
	}
}

def generatedVersionDir = layout.buildDirectory.dir('generated/version')

tasks.register('generateVersionProperties', WriteProperties) {
	destinationFile = generatedVersionDir.map { it.file('schema-version.properties') }
	property('version', version)
}

sourceSets.main.resources.srcDir(files(generatedVersionDir).builtBy('generateVersionProperties'))
