////////////////////////////////////////////////////////////////////////////////////////////////////////////
// General Gradle Settings
////////////////////////////////////////////////////////////////////////////////////////////////////////////

plugins {
	id 'java-library'
	id 'groovy'
	id 'maven-publish'
	id 'project-report'
	id 'application'
}

group = 'com.spidasoftware'
// SCHEMA_RELEASE_VERSION overrides the default on release builds.
// If you're changing the major version also change the currentVersion in ConverterUtils.
version = providers.environmentVariable('SCHEMA_RELEASE_VERSION')
	.filter { !it.isEmpty() }
	.getOrElse('14.0.2160921-SNAPSHOT')
description = 'JSON schemas, validation, and version conversion for integrating with SPIDA Software applications.'

java {
	toolchain { languageVersion = JavaLanguageVersion.of(11) }
	withSourcesJar()
}

// Schemas are kept in the top-level 'resources' dir rather than src/main/resources.
sourceSets.main.resources.srcDir('resources')

////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Dependencies
////////////////////////////////////////////////////////////////////////////////////////////////////////////
application {
    mainClass = 'com.spidasoftware.schema.validation.CommandLineValidator'
}

// Internal Artifactory is optional so a fresh clone can still resolve public dependencies.
def artifactoryUrl = providers.environmentVariable('ARTIFACTORY_URL_EXPOSED').filter { !it.isEmpty() }

repositories {
	mavenCentral()
	maven { url = artifactoryUrl.get() }
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		maven {
			url = artifactoryUrl.get()
			credentials {
				username = providers.environmentVariable('ARTIFACTORY_USERNAME').orNull
				password = providers.environmentVariable('ARTIFACTORY_PASSWORD').orNull
			}
		}
	}
}

// Logging binding for the standalone CommandLineValidator only. Kept out of the published POM so
// consumers (calc, min) choose their own SLF4J binding and are not forced onto a newer slf4j-api.
// Extends runtimeClasspath so Gradle resolves a single slf4j-api version for the CLI.
configurations {
	cliRuntime {
		extendsFrom runtimeClasspath
		canBeConsumed = false
	}
}

dependencies {
	def groovyVersion = '2.5.14'
	def logbackVersion = '1.5.22'
	implementation group: 'org.apache.ant', name: 'ant', version: '1.10.18'
	implementation group: 'org.codehaus.groovy', name: 'groovy', version: groovyVersion
	implementation group: 'org.codehaus.groovy', name: 'groovy-ant', version: groovyVersion  // AntBuilder in ExchangeFile
	// Library surface is the SLF4J facade only. Stays at 1.7.x so the POM does not raise consumers' slf4j-api.
	implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.36'
	cliRuntime group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion  // pulls its matching slf4j-api 2.x
	testRuntimeOnly group: 'ch.qos.logback', name: 'logback-classic', version: logbackVersion
	api 'com.github.java-json-tools:json-schema-core:1.2.14'  // fge updated to java-json-tools - results schema does not parse
	api 'org.mozilla:rhino:1.7.15.1'  // replace the vulnerable version pulled in by json-schema-core
	api 'com.networknt:json-schema-validator:1.5.9'
	api 'org.apache.commons:commons-lang3:3.21.0'  // required by json-schema-validator
	implementation 'org.mongodb:bson:5.13.0'
	implementation group: 'com.spidasoftware', name: 'schema-v4', version:'0.1'
	testImplementation group: 'org.codehaus.groovy', name: 'groovy-json', version: groovyVersion  // JsonSlurper/JsonOutput
	testImplementation group: 'org.codehaus.groovy', name: 'groovy-test', version: groovyVersion  // GroovyTestCase
	testImplementation group: 'junit', name: 'junit', version:'4.13.2'
	testImplementation group: 'org.spockframework', name: 'spock-core', version: '2.3-groovy-2.5'
	testRuntimeOnly('net.bytebuddy:byte-buddy:1.14.2')  // so spock can create mocks
	testRuntimeOnly group: 'org.objenesis', name:'objenesis', version: '2.6'
	testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.9.2")
}

test {
	useJUnitPlatform()
    testLogging.showStandardStreams = true
	maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1
}

////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Build Process
////////////////////////////////////////////////////////////////////////////////////////////////////////////

// ValueSource lets the configuration cache run git as a tracked build input instead of
// an untracked external process at configuration time.
import javax.inject.Inject
import org.gradle.process.ExecOperations

abstract class GitValue implements ValueSource<String, GitValue.Params> {
	interface Params extends ValueSourceParameters {
		ListProperty<String> getArgs()
	}

	@Inject
	abstract ExecOperations getExec()

	@Override
	String obtain() {
		def out = new ByteArrayOutputStream()
		exec.exec { spec ->
			spec.commandLine(['git'] + parameters.args.get())
			spec.standardOutput = out
		}
		return out.toString().trim()
	}
}

def gitRevision = providers.of(GitValue) { parameters.args = ['rev-parse', '--short', 'HEAD'] }
def gitTimestamp = providers.of(GitValue) { parameters.args = ['show', '-s', '--format=%ct', 'HEAD'] }

tasks.named('jar') {
	manifest.attributes(
		'VCSVersion': gitRevision,
		'VCSTimeStamp': gitTimestamp,
		'Version': version
	)
}


////////////////////////////////////////////////////////////////////////////////////////////////////////////
// Command Line Tools
////////////////////////////////////////////////////////////////////////////////////////////////////////////

/**
 * Searches the project properties first (where the properties should be kept),
 * then the system properties (where older integrations might expect them).
 * Both are read through Providers so the configuration cache tracks them as inputs.
 */
Provider<String> findPropertyAnywhere(String propertyName) {
	return providers.gradleProperty(propertyName)
		.orElse(providers.systemProperty(propertyName))
		.filter { !it.isEmpty() }
}

Provider<String> schema = findPropertyAnywhere('schema')
Provider<RegularFile> jsonFile = layout.projectDirectory.file(findPropertyAnywhere('jsonFile'))

tasks.named('run') {
	classpath = sourceSets.main.output + configurations.cliRuntime
}

tasks.register('validateJson', JavaExec) {
	classpath = sourceSets.main.output + configurations.cliRuntime
	mainClass = 'com.spidasoftware.schema.validation.CommandLineValidator'

	// Evaluated at execution time so the providers stay lazy.
	// projectDirectory.file resolves relative paths against the project dir, not the daemon's cwd.
	argumentProviders.add({
		schema.present && jsonFile.present ? [schema.get(), jsonFile.get().asFile.absolutePath] : []
	} as CommandLineArgumentProvider)
}

def generatedVersionDir = layout.buildDirectory.dir('generated/version')

tasks.register('generateVersionProperties', WriteProperties) {
	destinationFile = generatedVersionDir.map { it.file('schema-version.properties') }
	property('version', version)
}

sourceSets.main.resources.srcDir(files(generatedVersionDir).builtBy('generateVersionProperties'))
